{% extends "base.html" %}
{% load static %}
{% block content %}
<div class="row justify-content-center mt-4 mt-md-5">
  <div class="col-11 col-sm-8 col-md-6 col-lg-4">
    <div class="card login-tarjeta shadow-sm">
      <div class="login-cabecera text-center">
        <img src="{% static 'img/Logo_tollocan.png' %}" alt="Grupo Tollocan" class="login-logo">
      </div>
      <div class="card-body p-4">
        <h4 class="mb-1 text-center">¿Olvidaste tu contraseña?</h4>
        <p class="text-muted text-center small mb-4">Escribe tu correo y avisaremos a los administradores.</p>
        {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">Correo electrónico</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-envelope"></i></span>
              <input type="email" name="correo" class="form-control" required autofocus>
            </div>
          </div>
          <div class="mb-3">
            <div class="form-check">
              <input class="form-check-input" type="radio" name="tipo" id="tipoCambio" value="cambio" checked>
              <label class="form-check-label" for="tipoCambio">Quiero que me cambien la contraseña</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="tipo" id="tipoRecordar" value="recordar">
              <label class="form-check-label" for="tipoRecordar">Quiero que me recuerden mi contraseña</label>
            </div>
          </div>
          <button class="btn btn-primary w-100 py-2">Enviar solicitud</button>
        </form>
        <p class="small mt-3 mb-0 text-center">
          <a href="{% url 'login' %}">Volver a iniciar sesión</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
